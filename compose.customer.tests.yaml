name: microservicios-customer-tests

services:
  postgres-tests:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: customer_test
      POSTGRES_PASSWORD: customer_test_password
      POSTGRES_DB: customer_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U customer_test -d customer_test"]
      interval: 2s
      timeout: 5s
      retries: 20
    networks:
      - tests-net

  customer-tests:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /workspace
    volumes:
      - .:/workspace
      - test-nuget:/root/.nuget/packages
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CUSTOMER_TEST_CONNECTION: "Host=postgres-tests;Database=customer_test;Username=customer_test;Password=customer_test_password"
      ConnectionStrings__CustomerDb: "Host=postgres-tests;Database=customer_test;Username=customer_test;Password=customer_test_password"
      Database__ApplyMigrationsOnStartup: "true"
    depends_on:
      postgres-tests:
        condition: service_healthy
    command: ["dotnet", "test", "tests/Customer.Tests/Customer.Tests.csproj", "--configuration", "Release", "--logger", "console;verbosity=normal"]
    networks:
      - tests-net

networks:
  tests-net:
    driver: bridge

volumes:
  test-nuget:
