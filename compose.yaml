name: microservicios

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
      POSTGRES_DB: postgres
      PRODUCT_DB_USER: product_user
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?Definir PRODUCT_DB_PASSWORD en .env}
      PRODUCT_DB_NAME: product_db
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-product.sh:/docker-entrypoint-initdb.d/10-product.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$PRODUCT_DB_PASSWORD"
          psql -h 127.0.0.1 -U "$$PRODUCT_DB_USER" -d "$$PRODUCT_DB_NAME"
          -c 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - microservices-net

  product-api:
    build:
      context: .
      dockerfile: src/Services/Product/Product.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Database__ApplyMigrationsOnStartup: "true"
      AutoMapper__LicenseKey: ${AUTOMAPPER_LICENSE_KEY:-}
      ConnectionStrings__ProductDb: "Host=postgres;Port=5432;Database=product_db;Username=product_user;Password=${PRODUCT_DB_PASSWORD:?Definir PRODUCT_DB_PASSWORD en .env}"
    ports:
      - "127.0.0.1:${PRODUCT_API_PORT:-5001}:8080"
    volumes:
      - product-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - microservices-net

  product-tools:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nuget-packages:/root/.nuget/packages
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      ConnectionStrings__ProductDb: "Host=postgres;Port=5432;Database=product_db;Username=product_user;Password=${PRODUCT_DB_PASSWORD:?Definir PRODUCT_DB_PASSWORD en .env}"
    command: ["dotnet", "--info"]
    networks:
      - microservices-net

  customer-db-init:
    image: postgres:17-bookworm
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?Definir CUSTOMER_DB_PASSWORD en .env}
    volumes:
      - ./docker/postgres/init-customer.sh:/scripts/init-customer.sh:ro
    entrypoint: ["bash", "/scripts/init-customer.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

  customer-api:
    build:
      context: .
      dockerfile: src/Services/Customer/Customer.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Database__ApplyMigrationsOnStartup: "true"
      AutoMapper__LicenseKey: ${AUTOMAPPER_LICENSE_KEY:-}
      ConnectionStrings__CustomerDb: "Host=postgres;Port=5432;Database=customer_db;Username=customer_user;Password=${CUSTOMER_DB_PASSWORD:?Definir CUSTOMER_DB_PASSWORD en .env}"
    ports:
      - "127.0.0.1:${CUSTOMER_API_PORT:-5002}:8080"
    volumes:
      - customer-logs:/app/logs
    depends_on:
      customer-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - microservices-net

  customer-tools:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nuget-packages:/root/.nuget/packages
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      ConnectionStrings__CustomerDb: "Host=postgres;Port=5432;Database=customer_db;Username=customer_user;Password=${CUSTOMER_DB_PASSWORD:?Definir CUSTOMER_DB_PASSWORD en .env}"
    command: ["dotnet", "--info"]
    networks:
      - microservices-net

  order-db-init:
    image: postgres:17-bookworm
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Definir ORDER_DB_PASSWORD en .env}
    volumes:
      - ./docker/postgres/init-order.sh:/scripts/init-order.sh:ro
    entrypoint: ["bash", "/scripts/init-order.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-net

  order-api:
    build:
      context: .
      dockerfile: src/Services/Order/Order.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Database__ApplyMigrationsOnStartup: "true"
      AutoMapper__LicenseKey: ${AUTOMAPPER_LICENSE_KEY:-}
      ConnectionStrings__OrderDb: "Host=postgres;Port=5432;Database=order_db;Username=order_user;Password=${ORDER_DB_PASSWORD:?Definir ORDER_DB_PASSWORD en .env}"
    ports:
      - "127.0.0.1:${ORDER_API_PORT:-5003}:8080"
    volumes:
      - order-logs:/app/logs
    depends_on:
      order-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - microservices-net

  order-tools:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nuget-packages:/root/.nuget/packages
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      ConnectionStrings__OrderDb: "Host=postgres;Port=5432;Database=order_db;Username=order_user;Password=${ORDER_DB_PASSWORD:?Definir ORDER_DB_PASSWORD en .env}"
    command: ["dotnet", "--info"]
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  postgres-data:
  nuget-packages:
  product-logs:
  customer-logs:
  order-logs:
